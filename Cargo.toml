[workspace]
resolver = "3"
members = ["puzzled_solver", "puzzled_config", "puzzled", "puzzled_polyform"]

[workspace.package]
version = "1.2.4"
edition = "2024"

[workspace.dependencies]
puzzled_polyform = { path = "puzzled_polyform" }
puzzled_solver = { path = "puzzled_solver" }
puzzled_config = { path = "puzzled_config" }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["gnome_50", "v4_24"] }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_10"] }
pangocairo = "0.22.9"
log = "0.4.30"
simple_logger = "5.2.0"
time = { version = "0.3.47", features = ["local-offset"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150" }
semver = "1.0.28"
regex = "1.12.4"
rand = "0.10.1"
dlx-rs = { git = "https://github.com/Til7701/dlx-rs", rev = "342d7dda487f1465af67a082e04abd5543214866" }
